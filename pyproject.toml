[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# GRiM is the motion layer (`grim.motion`) only. GRiD — the dynamics codegen
# (`grid_codegen`), its runtime wrapper (`grid_rbd`) and the URDFParser /
# RBDReference / GLASS peers — is the external/GRiD submodule; `import grim` puts a
# source checkout of it on sys.path, or install it (`pip install -e external/GRiD`).
name = "grim"
version = "0.6.0"
description = "GPU motion generation (IK, trajectory optimization, collision) built on GRiD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "A2R Lab"},
]
keywords = ["robotics", "inverse-kinematics", "trajectory-optimization", "cuda", "gpu", "code-generation"]
dependencies = [
    "numpy>=1.23",
    "jax>=0.4.40",
]

[project.optional-dependencies]
# crocket traces (traced=True kinematics, grim.motion.dynamics): installed from
# external/crocket by install/motion_install.sh, not from PyPI.
dev = [
    "pytest>=7.0",
    "pytest-gpu-proof>=0.4.1",
]

[project.urls]
Repository = "https://github.com/commalab/GRiM"

[tool.setuptools.packages.find]
where = ["bindings"]
include = ["grim*"]

[tool.setuptools.package-data]
grim = ["py.typed"]
"grim.motion" = ["kernels/*.cuh", "kernels/*.cu", "kernels/*/*.cu", "kernels/*/*.cuh"]

[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".*", "build", "dist", "external", "scratchpad"]
markers = [
    "pinocchio_equivalence: numpy oracle vs Pinocchio (CPU).",
    "cuda_equivalence: CUDA kernels vs the float64 oracle (needs a GPU).",
    "gpu_proof: recorded in the signed pytest-gpu-proof receipt (auto-applied to cuda_equivalence by test/motion/conftest.py).",
]

[tool.gpu_proof]
# GPU tests run locally; the signed receipt (gpu-proof.json) is verified CPU-only in CI.
#   python -m pytest test/motion --gpu-proof-enable
#   gpu-proof verify --receipt gpu-proof.json --policy test/gpu-proof-policy.yaml
mode = "local"
output = "gpu-proof.json"
github_username = "saiccoumar"
required_marker = "gpu_proof"
# external/crocket and external/GRiD are gitlinks: bumping either stales the receipt.
fingerprint_paths = [
    "bindings/grim", "external/crocket", "external/GRiD", "pyproject.toml",
    "test/motion", "test/gpu-proof-policy.yaml",
]
fingerprint_excluded_paths = ["gpu-proof.json", "test/motion/TESTING.md"]
max_age_days = 30
